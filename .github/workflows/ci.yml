name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test tools
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y meson ninja-build texlive-latex-base
          texlive-fonts-recommended
      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
        run: meson setup build
      - name: Build
        run: meson compile -C build
      - name: Test
        run: meson test -C build --no-rebuild --print-errorlogs
      - name: Verify benchmark snapshot
        run: tests/corpus/check_manifests.sh
